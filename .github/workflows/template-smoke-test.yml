name: Template Smoke Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  generate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Generate sample project
        run: >
          poetry run flink-app-agent
          --request "Read from Kafka payments, key by account_id, emit Alert within 10 minutes, write to Kafka alerts"
          --output ./generated/smoke-test

      - name: Validate generated files
        shell: bash
        run: |
          test -f ./generated/smoke-test/generation_report.json
          test -f ./generated/smoke-test/pom.xml
          test -f ./generated/smoke-test/src/main/java/com/example/AlertJob.java
