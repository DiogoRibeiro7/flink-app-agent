name: Template Smoke Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  generate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Generate sample project
        run: >
          poetry run flink-app-agent
          --request "Create a Flink job named smoke test that reads from topic payments, writes to topic alerts, keys by account_id, uses consumer group smoke-group, and emits an alert when amount > 1000."
          --output-dir ./generated/smoke-test

      - name: Validate generated files
        shell: bash
        run: |
          test -f ./generated/smoke-test/job_spec.json
          test -f ./generated/smoke-test/pom.xml
          test -f ./generated/smoke-test/src/main/java/com/example/SmokeTest.java
