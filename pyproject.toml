[tool.poetry]
name = "flink-app-agent"
version = "0.8.0"
description = "A small multi-family CLI that turns narrow plain-English Flink requests into a validated spec, a generated project, and an optional compile verification."
authors = ["Diogo <diogo@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "flink_app_agent", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = "^2.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = ">=5,<8"

[tool.poetry.scripts]
flink-app-agent = "flink_app_agent.main:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/flink_app_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
