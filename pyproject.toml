[tool.poetry]
name = "flink-app-agent"
version = "0.1.0"
description = "A small agent that converts plain-English Flink requests into a structured spec and a generated project."
authors = ["Diogo <diogo@example.com>"]
readme = "README.md"
packages = [{ include = "flink_app_agent", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[tool.poetry.scripts]
flink-app-agent = "flink_app_agent.main:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
